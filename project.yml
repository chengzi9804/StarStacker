name: StarStacker
options:
  bundleIdPrefix: com.starstacker
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    ENABLE_BITCODE: NO
targets:
  StarStacker:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets
    info:
      path: Sources/StarStackerApp/Info.plist
      properties:
        CFBundleDisplayName: StarStacker
        CFBundleIdentifier: com.starstacker.StarStacker
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryAddUsageDescription: "需要相册权限以保存堆栈后的星空照片"
        NSPhotoLibraryUsageDescription: "需要相册权限以读取RAW/DNG星空照片"
        NSCameraUsageDescription: "需要相机权限拍摄星空RAW照片"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.starstacker.StarStacker
        PRODUCT_NAME: StarStacker
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

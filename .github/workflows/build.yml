name: Build StarStacker Unsigned IPA
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Bootstrap directories
        run: bash scripts/bootstrap.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show project structure
        run: find . -name "*.swift" -o -name "*.metal" | head -50

      - name: Archive (no code signing)
        run: |
          xcodebuild archive \
            -project StarStacker.xcodeproj \
            -scheme StarStacker \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath build/StarStacker.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Export unsigned IPA (manual package)
        run: |
          mkdir -p build/output/Payload
          cp -R build/StarStacker.xcarchive/Products/Applications/StarStacker.app build/output/Payload/
          cd build/output
          zip -r StarStacker.ipa Payload
          ls -la StarStacker.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarStacker-Unsigned-IPA
          path: build/output/StarStacker.ipa
